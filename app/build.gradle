plugins { id 'com.android.application' version '8.9.2' }

android {
    namespace 'com.harborlens.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.harborlens.app'
        minSdk 29
        targetSdk 34
        versionCode providers.environmentVariable('BSCA_VERSION_CODE').map { it.toInteger() }.getOrElse(4)
        versionName providers.environmentVariable('BSCA_VERSION_NAME').getOrElse('0.4')
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
