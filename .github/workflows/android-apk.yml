name: Build Android APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and verify APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      signing: ${{ steps.sign.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build debug and release
        run: |
          export BSCA_VERSION_CODE="$((GITHUB_RUN_NUMBER + 3))"
          export BSCA_VERSION_NAME="0.4.${GITHUB_RUN_NUMBER}"
          bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Sign and verify APKs
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is missing}}"
          tools="$sdk_root/build-tools/35.0.0"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BSCA-SB-Scan-debug.apk

          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
            : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
            : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
            umask 077
            keystore="$(mktemp "$RUNNER_TEMP/bsca-signing.XXXXXX")"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            mode=release-key
          else
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Release signing is incomplete. Set ANDROID_KEYSTORE_BASE64 as well."
              exit 1
            fi
            keystore="$HOME/.android/debug.keystore"
            ANDROID_KEY_ALIAS=androiddebugkey
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_PASSWORD=android
            if [[ ! -f "$keystore" ]]; then
              umask 077
              mkdir -p "$(dirname "$keystore")"
              keytool -genkeypair -noprompt -keystore "$keystore" -storetype JKS \
                -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
                -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            mode=debug-key
            echo "::warning::Release APK uses this runner's debug key. Configure release signing secrets for stable upgrades."
          fi

          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/bsca-aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/BSCA-SB-Scan-release.apk "$RUNNER_TEMP/bsca-aligned.apk"
          "$tools/apksigner" verify --verbose dist/BSCA-SB-Scan-debug.apk
          "$tools/apksigner" verify --verbose dist/BSCA-SB-Scan-release.apk
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BSCA-SB-Scan-APKs
          path: dist/*.apk